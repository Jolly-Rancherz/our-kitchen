<!DOCTYPE html>
<html lang="en-CA" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Kitchen</title>
<meta name="description" content="Corey ♥ Faith — recipes we love.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- solid status bar (Update 8). black-translucent makes iOS 26 size the app one status bar short, leaving a dead strip
     at the bottom; "default" puts the app below a solid status bar tinted with theme-color, reaching the bottom edge.
     iOS reads this only when the icon is added: older installs keep black-translucent and the 6.1 strip layout. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Kitchen">
<!-- status bar colour = the header (navy); applyTheme() in app.js keeps both in step with the app's own theme -->
<meta name="theme-color" content="#082048" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060F26" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- launch images: what iOS shows while the home-screen app starts (instead of a black screen). They match the
     splash's first frame (navy, centred wordmark; the heart pops in afterwards). iOS reads these when the icon is
     added to the home screen. -->
<link rel="apple-touch-startup-image" href="icons/launch/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/launch/launch-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="preload" href="fonts/Cinzel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InstrumentSerif-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Outfit.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // before first paint: theme + text size (no flash), and the iOS 26 bottom strip so the splash is centred on the
  // physical screen from frame one (same geometry as the launch image; see "iPhone home-screen fit" in app.css)
  try {
    var s = JSON.parse(localStorage.getItem('ourkitchen.v1') || '{}').settings || {};
    var t = s.theme || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (s.bigText) document.documentElement.classList.add('big');
    // the strip only exists with black-translucent (old installs), recognisable by a top safe area equal to the gap;
    // with the solid status bar the top safe area is 0 and the splash simply fills the view
    var gap = screen.height - innerHeight, pr = document.createElement('div');
    pr.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';
    document.documentElement.appendChild(pr); var sat = parseFloat(getComputedStyle(pr).paddingTop) || 0; pr.remove();
    if (navigator.standalone && innerHeight > innerWidth && sat >= 20 && Math.abs(gap - sat) <= 3) document.documentElement.style.setProperty('--splash-strip', gap + 'px');
  } catch (e) {}
</script>
<style>
  /* critical first-paint styles: page colour + splash, before app.css */
  html{background:#F5E6CE} html[data-theme="dark"]{background:#0B1734}
  #splash{position:fixed;left:0;right:0;top:0;height:calc(100% + var(--splash-strip,0px));z-index:500;background:#F5E6CE;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease}
  html[data-theme="dark"] #splash{background:#0B1734}
  #splash.out{opacity:0;pointer-events:none}
  .splash-inner{text-align:center;animation:splashIn .7s ease both}
  .splash-our{font-family:"Cinzel";font-weight:600;font-size:1.1rem;letter-spacing:.42em;color:var(--gold);padding-left:.42em}
  .splash-kitchen{font-family:"Cinzel";font-weight:500;font-size:2.6rem;letter-spacing:.1em;color:var(--ink);line-height:1.05;margin-top:2px}
  .splash-names{font-family:"Instrument Serif";font-style:italic;font-size:1.35rem;color:var(--ink2);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
  .splash-heart{width:16px;height:16px;fill:var(--gold);animation:beat 1.1s ease .3s both}
  @keyframes splashIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes beat{0%{transform:scale(.6);opacity:0}45%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
  /* home-screen app: the launch image already shows the wordmark, so it is there from frame one (no fade-in) */
  @media (display-mode: standalone){.splash-inner{animation:none}}
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-our">OUR</div>
    <div class="splash-kitchen">KITCHEN</div>
    <div class="splash-names">Corey <svg class="splash-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg> Faith</div>
  </div>
</div>

<div id="app">

    <div class="tb-left" id="tbLeft"></div>
    <div class="tb-title" id="tbTitle">OUR KITCHEN</div>
    <div class="tb-right" id="tbRight"></div>
  </header>
  <div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></div>
  <main id="view" tabindex="-1"></main>
  <nav id="tabbar" aria-label="Main">
    <a href="#/" data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span>Recipes</span></a>
    <a href="#/pantry" data-tab="pantry"><svg viewBox="0 0 24 24"><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M8 3h8v4H8z"/><path d="M6 12h12"/></svg><span>Pantry</span></a>
    <a href="#/grocery" data-tab="grocery"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Grocery</span><i class="badge" id="groceryBadge"></i></a>
    <a href="#/budget" data-tab="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.5-.9-1.6-1.4-2.8-1.4-1.6 0-2.8.8-2.8 2.1 0 2.9 5.8 1.5 5.8 4.3 0 1.3-1.3 2.1-3 2.1-1.3 0-2.4-.6-2.9-1.5M12 6.3v1.5M12 16.6v1.3"/></svg><span>Budget</span></a>
    <a href="#/us" data-tab="us"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.9-7.5-10.4A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 7.5 2.9c0 5.5-7.5 10.4-7.5 10.4z"/></svg><span>Us</span></a>
    <a href="#/acura" data-tab="acura"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.6" rx="4.4" ry="3.7"/><ellipse cx="6.3" cy="10.2" rx="1.8" ry="2.4" transform="rotate(-22 6.3 10.2)"/><ellipse cx="9.7" cy="6.5" rx="1.8" ry="2.5"/><ellipse cx="14.3" cy="6.5" rx="1.8" ry="2.5"/><ellipse cx="17.7" cy="10.2" rx="1.8" ry="2.4" transform="rotate(22 17.7 10.2)"/></svg><span>Acura</span></a>
  </nav>
</div>

<div id="sheetWrap" hidden><div class="sheet-scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheetBody"></div></div></div>
<div id="cook" hidden></div>
<div id="welcome" hidden></div>
<div id="edge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>

<script src="js/app.js"></script>
</body>
</html>
