<!DOCTYPE html>

<head>

<title>Our Kitchen</title>
<meta name="description" content="Corey ♥ Faith — recipes we love.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preload" href="fonts/Outfit.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // apply theme + text size before first paint (no flash)
  try {
    var s = JSON.parse(localStorage.getItem('ourkitchen.v1') || '{}').settings || {};
    var t = s.theme || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (s.bigText) document.documentElement.classList.add('big');
  } catch (e) {}
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-our">OUR</div>
    <div class="splash-kitchen">KITCHEN</div>
    <div class="splash-names">Corey <svg class="splash-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg> Faith</div>
  </div>
</div>

    <div class="tb-title" id="tbTitle">OUR KITCHEN</div>
    <div class="tb-right" id="tbRight"></div>
  </header>
  <div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></div>
  <main id="view" tabindex="-1"></main>
  <nav id="tabbar" aria-label="Main">
    <a href="#/" data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span>Recipes</span></a>

    <a href="#/acura" data-tab="acura"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.6" rx="4.4" ry="3.7"/><ellipse cx="6.3" cy="10.2" rx="1.8" ry="2.4" transform="rotate(-22 6.3 10.2)"/><ellipse cx="9.7" cy="6.5" rx="1.8" ry="2.5"/><ellipse cx="14.3" cy="6.5" rx="1.8" ry="2.5"/><ellipse cx="17.7" cy="10.2" rx="1.8" ry="2.4" transform="rotate(22 17.7 10.2)"/></svg><span>Acura</span></a>

<div id="sheetWrap" hidden><div class="sheet-scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheetBody"></div></div></div>

</html>
